name: Build iOS .ipa

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    name: Build Fajr Academy .ipa
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Xcode Archive (Unsigned .ipa)
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Found Workspace: $WORKSPACE"
          echo "Using Scheme: $SCHEME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/FajrAcademy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/FajrAcademy.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr FajrAcademy.ipa Payload
          echo "Created FajrAcademy.ipa successfully!"
          ls -lh FajrAcademy.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FajrAcademy-iOS-ipa
          path: FajrAcademy.ipa
          if-no-files-found: error
